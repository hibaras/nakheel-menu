<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مطعم النخيل - القائمة الرقمية</title>
<style>
:root{--gold:#b8860b;--gold-light:#fff4cf;--brown:#3d2b1f;--cream:#fffaf0;--white:#fff;--gray:#6b7280;--border:#e5e7eb;--danger:#b42318;--success:#166534;--shadow:0 2px 12px rgba(0,0,0,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--brown);font-family:Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}.container{width:min(100% - 20px,760px);margin-inline:auto}
header{background:#fff;padding:18px 0 12px;border-bottom:1px solid var(--border)}.brand{text-align:center;margin-bottom:10px}.brand h1{margin:0;font-size:27px;line-height:1.25}.brand p{margin:5px 0 0;color:var(--gray);font-size:14px}.mode-bar{margin:0 auto 10px;padding:8px 12px;border-radius:10px;background:var(--gold-light);color:#694f00;border:1px solid #eadb98;text-align:center;font-weight:700;font-size:14px;word-break:break-word}
.search-wrap{position:sticky;top:0;z-index:30;background:var(--cream);padding:10px 0;border-bottom:1px solid rgba(184,134,11,.15)}.search-box{position:relative}.search-box input{width:100%;min-height:48px;padding:10px 44px 10px 14px;border:1px solid #d6d9dd;border-radius:13px;background:#fff;color:var(--brown);outline:none}.search-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,134,11,.12)}.search-icon{position:absolute;top:50%;right:14px;transform:translateY(-50%);color:var(--gray);pointer-events:none;font-size:19px}
.category-nav{position:sticky;top:69px;z-index:29;display:flex;gap:7px;overflow-x:auto;padding:8px 0 9px;background:var(--cream);scrollbar-width:thin}.category-nav::-webkit-scrollbar{height:4px}.category-btn{flex:0 0 auto;border:1px solid #d9c986;background:#fff;color:var(--brown);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap}.category-btn.active{background:var(--gold);border-color:var(--gold);color:#fff}
main{padding:8px 0 100px}.section{scroll-margin-top:130px;margin-bottom:25px}.section-title{margin:10px 0;font-size:22px;display:flex;align-items:center;justify-content:space-between;gap:10px}.section-title span:last-child{color:var(--gray);font-size:13px;font-weight:normal}.items{display:grid;gap:11px}.item-card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:13px;box-shadow:var(--shadow);min-width:0}.item-card.unavailable{opacity:.52}.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-width:0}.item-name{margin:0;font-size:18px;line-height:1.35;overflow-wrap:anywhere}.item-desc{margin:5px 0 0;color:var(--gray);font-size:14px;overflow-wrap:anywhere}.price{white-space:nowrap;font-weight:800;color:var(--gold);font-size:16px;direction:rtl}.item-bottom{margin-top:11px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.availability{font-size:13px;font-weight:700;color:var(--success)}.availability.unavailable{color:var(--danger)}
.add-btn,.send-btn{border:0;border-radius:10px;min-height:42px;padding:9px 14px;font-weight:700}.add-btn{background:var(--gold);color:#fff;min-width:108px}.add-btn:disabled{background:#c8c8c8;cursor:not-allowed}.qty-controls{display:inline-flex;align-items:center;gap:7px}.qty-btn{width:38px;height:38px;padding:0;border-radius:9px;border:1px solid #d4d7db;background:#fff;color:var(--brown);font-size:21px;line-height:1}.qty-value{min-width:30px;text-align:center;font-weight:800}.empty-results{display:none;padding:25px 12px;text-align:center;color:var(--gray);background:#fff;border:1px dashed #cfd3d7;border-radius:14px}
.cart-bar{position:fixed;right:0;bottom:0;left:0;z-index:50;display:none;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:var(--brown);color:#fff;box-shadow:0 -5px 20px rgba(0,0,0,.18);border:0;text-align:initial}.cart-bar.visible{display:block}.cart-bar-inner{width:min(100%,760px);margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.cart-summary{min-width:0}.cart-summary strong{display:block;font-size:16px}.cart-summary small{display:block;color:#f2e6d6;font-size:13px}.cart-open-hint{color:#fff4cf;font-size:13px;white-space:nowrap}
dialog{width:min(94vw,620px);max-height:88vh;border:0;border-radius:18px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(0,0,0,.58)}.dialog-content{padding:18px;overflow-y:auto;max-height:88vh;background:#fff}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:12px}.dialog-head h2{margin:0;font-size:21px}.icon-close{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:#fff;font-size:22px}.cart-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.cart-line-name{font-weight:800;overflow-wrap:anywhere}.cart-line-price{color:var(--gold);font-weight:800;white-space:nowrap}.cart-line-controls{margin-top:6px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}.remove-btn{border:1px solid #e2b1ac;color:var(--danger);background:#fff7f6;border-radius:8px;padding:6px 9px}.order-total{display:flex;justify-content:space-between;gap:10px;padding:14px 0;font-weight:900;font-size:19px}.form-area{margin-top:8px;border-top:1px solid var(--border);padding-top:14px}.form-area h3{margin:0 0 10px;font-size:18px}.field{margin-bottom:12px}.field label{display:block;margin-bottom:5px;font-weight:700}.field input{width:100%;min-height:46px;padding:9px 11px;border-radius:10px;border:1px solid #cfd4da;outline:none;background:#fff}.field input.invalid{border-color:#dc6b5f;box-shadow:0 0 0 3px rgba(180,35,24,.08)}.field-error{min-height:21px;margin-top:3px;color:var(--danger);font-size:13px}.send-btn{width:100%;background:#15803d;color:#fff;margin-top:7px}.send-btn:disabled{background:#aaa;cursor:not-allowed}.browse-message{display:none;margin-top:16px;padding:12px;border-radius:10px;background:#f3f4f6;color:#4b5563;text-align:center;font-size:14px}
@media (min-width:650px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="container"><div class="brand"><h1 id="shopTitle"></h1><p>قائمة الطعام الرقمية</p></div><div id="modeBar" class="mode-bar"></div></div></header>
<div class="search-wrap"><div class="container"><div class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input id="searchInput" type="search" inputmode="search" autocomplete="off" placeholder="ابحث عن صنف..."></div><nav id="categoryNav" class="category-nav" aria-label="أقسام القائمة"></nav></div></div>
<main class="container"><div id="menu"></div><div id="emptyResults" class="empty-results">لا توجد أصناف تطابق البحث.</div></main>
<button id="cartBar" class="cart-bar" type="button" aria-label="فتح ملخص الطلب"><div class="cart-bar-inner"><div class="cart-summary"><strong id="cartCount">0 صنف</strong><small id="cartTotal">المجموع: 0 د.ع</small></div><span class="cart-open-hint">اضغط لعرض الطلب</span></div></button>
<dialog id="cartDialog"><div class="dialog-content"><div class="dialog-head"><h2>ملخص الطلب</h2><button class="icon-close" id="closeDialog" type="button" aria-label="إغلاق">×</button></div><div id="cartLines"></div><div class="order-total"><span>المجموع الكلي</span><span id="dialogTotal">0 د.ع</span></div><div id="deliveryFields" class="form-area" hidden><h3>بيانات التوصيل</h3><div class="field"><label for="customerName">الاسم</label><input id="customerName" type="text" autocomplete="name"><div id="nameError" class="field-error" aria-live="polite"></div></div><div class="field"><label for="customerAddress">العنوان</label><input id="customerAddress" type="text" autocomplete="street-address"><div id="addressError" class="field-error" aria-live="polite"></div></div><div class="field"><label for="customerPhone">رقم الهاتف</label><input id="customerPhone" type="tel" inputmode="tel" autocomplete="tel"><div id="phoneError" class="field-error" aria-live="polite"></div></div></div><button id="sendOrderBtn" class="send-btn" type="button">إرسال الطلب عبر واتساب</button><div id="browseMessage" class="browse-message"></div></div></dialog>
<script>
// Customer-editable menu data.
const MENU=[
{section:"مقبلات",items:[{name:"حمص",description:"حمص ناعم مع الطحينة وزيت الزيتون.",price:3000,available:true},{name:"متبل باذنجان",description:"باذنجان مشوي مع الطحينة والليمون.",price:3500,available:true},{name:"تبولة",description:"بقدونس وطماطم وبرغل مع الليمون.",price:4000,available:true},{name:"فتوش",description:"خضار طازجة مع الخبز المحمص ودبس الرمان.",price:4000,available:true},{name:"ورق عنب",description:"ورق عنب محشو بالأرز والخضار.",price:4500,available:true},{name:"بطاطا حارة",description:"بطاطا مقرمشة مع الثوم والكزبرة.",price:3500,available:false}]},
{section:"أطباق رئيسية",items:[{name:"دجاج على الفحم",description:"نصف دجاجة متبلة ومشوية على الفحم.",price:10000,available:true},{name:"كبسة دجاج",description:"أرز متبل مع دجاج وسلطة جانبية.",price:9000,available:true},{name:"برياني عراقي",description:"أرز برياني مع دجاج وبطاطا ومكسرات.",price:9500,available:true},{name:"قوزي بالرز",description:"لحم غنم مع أرز متبل ومكسرات.",price:15000,available:true},{name:"مقلوبة باذنجان",description:"أرز مع باذنجان ولحم وسلطة.",price:11000,available:true},{name:"تشريب لحم",description:"خبز عراقي مع مرق اللحم والخضار.",price:8500,available:false}]},
{section:"مشاوي",items:[{name:"كباب لحم",description:"أسياخ كباب لحم مشوية مع خبز وسلطة.",price:10000,available:true},{name:"تكة لحم",description:"قطع لحم متبلة ومشوية على الفحم.",price:12000,available:true},{name:"شيش طاووق",description:"قطع دجاج متبلة ومشوية على الفحم.",price:9500,available:true},{name:"كباب دجاج",description:"كباب دجاج مع بهارات خاصة.",price:9000,available:true},{name:"مشكل مشاوي",description:"تشكيلة من الكباب والتكة والشيش طاووق.",price:16000,available:true},{name:"ريش غنم",description:"ريش غنم طرية مشوية على الفحم.",price:14500,available:false}]},
{section:"حلويات",items:[{name:"بقلاوة",description:"طبقات مقرمشة محشوة بالمكسرات.",price:3000,available:true},{name:"كنافة",description:"كنافة ساخنة بالجبن وشراب السكر.",price:5000,available:true},{name:"دهين عراقي",description:"حلوى عراقية غنية بنكهة الهيل.",price:3500,available:true},{name:"أرز بالحليب",description:"أرز بالحليب مع القرفة والمكسرات.",price:3000,available:true},{name:"تشيز كيك",description:"قطعة تشيز كيك بطبقة فواكه.",price:5500,available:true},{name:"آيس كريم",description:"ثلاث كرات من اختيارك.",price:4000,available:false}]},
{section:"مشروبات",items:[{name:"بيبسي",description:"علبة مشروب غازي مبردة.",price:1500,available:true},{name:"ميرندا",description:"علبة مشروب برتقال مبردة.",price:1500,available:true},{name:"ماء",description:"قنينة ماء معدني.",price:500,available:true},{name:"شاي عراقي",description:"شاي أسود عراقي ساخن.",price:1000,available:true},{name:"شاي بالهيل",description:"شاي أسود مع الهيل.",price:1500,available:true},{name:"عصير برتقال",description:"عصير برتقال طازج.",price:3000,available:false}]}
];
// WhatsApp phone number in international format without plus signs, spaces, or dashes.
const PHONE="9647818282189";
// Maximum valid table number accepted from the t URL parameter.
const TABLES_MAX=200;
const SHOP="مطعم النخيل";
const state={cart:new Map(),mode:"browse",tableNumber:null,search:""};
const $=id=>document.getElementById(id);const menuElement=$("menu"),categoryNav=$("categoryNav"),searchInput=$("searchInput"),modeBar=$("modeBar"),cartBar=$("cartBar"),cartDialog=$("cartDialog"),cartLines=$("cartLines"),sendOrderBtn=$("sendOrderBtn"),browseMessage=$("browseMessage"),deliveryFields=$("deliveryFields"),emptyResults=$("emptyResults");
function readOrderMode(){const p=new URLSearchParams(location.search),raw=p.get("t"),d=p.get("d");if(raw!==null&&/^\d+$/.test(raw)){const n=Number(raw);if(Number.isInteger(n)&&n>0&&n<=TABLES_MAX){state.mode="table";state.tableNumber=n;return}}if(d==="1"){state.mode="delivery";return}state.mode="browse";state.tableNumber=null}
function formatPrice(v){return `${Number(v).toLocaleString("ar-IQ")} د.ع`}
function flattenMenu(){return MENU.flatMap(g=>g.items.map((item,index)=>({...item,key:`${g.section}::${index}`,section:g.section})))}
function findItem(key){return flattenMenu().find(x=>x.key===key)||null}
function filteredItems(g){const term=state.search.trim().toLocaleLowerCase("ar");return g.items.map((item,index)=>({item,index})).filter(({item})=>!term||`${item.name} ${item.description} ${g.section}`.toLocaleLowerCase("ar").includes(term))}
function renderCategoryNav(){categoryNav.innerHTML="";MENU.forEach((g,i)=>{const b=document.createElement("button");b.type="button";b.className=`category-btn${i===0?" active":""}`;b.textContent=g.section;b.addEventListener("click",()=>{document.getElementById(`section-${i}`)?.scrollIntoView({behavior:"smooth",block:"start"});document.querySelectorAll(".category-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active")});categoryNav.appendChild(b)})}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function buildQtyControls(key,q){const w=document.createElement("div");w.className="qty-controls";const minus=document.createElement("button"),value=document.createElement("span"),plus=document.createElement("button");minus.type=plus.type="button";minus.className=plus.className="qty-btn";minus.textContent="−";plus.textContent="+";minus.setAttribute("aria-label","إنقاص الكمية");plus.setAttribute("aria-label","زيادة الكمية");value.className="qty-value";value.textContent=q;minus.addEventListener("click",()=>changeQuantity(key,-1));plus.addEventListener("click",()=>changeQuantity(key,1));w.append(minus,value,plus);return w}
function changeQuantity(key,d){const next=(state.cart.get(key)||0)+d;if(next<=0)state.cart.delete(key);else state.cart.set(key,next);renderMenu();updateCartBar();renderCartDialog()}
function renderMenu(){menuElement.innerHTML="";let visible=0;MENU.forEach((g,si)=>{const matches=filteredItems(g);if(!matches.length)return;visible+=matches.length;const s=document.createElement("section");s.className="section";s.id=`section-${si}`;s.innerHTML=`<h2 class="section-title"><span>${esc(g.section)}</span><span>${matches.length} صنف</span></h2>`;const items=document.createElement("div");items.className="items";matches.forEach(({item,index})=>{const key=`${g.section}::${index}`,q=state.cart.get(key)||0,card=document.createElement("article");card.className=`item-card${item.available?"":" unavailable"}`;card.innerHTML=`<div class="item-top"><div><h3 class="item-name">${esc(item.name)}</h3><p class="item-desc">${esc(item.description)}</p></div><div class="price">${formatPrice(item.price)}</div></div><div class="item-bottom"><span class="availability${item.available?"":" unavailable"}">${item.available?"متوفر":"غير متوفر"}</span><div class="item-action"></div></div>`;const a=card.querySelector(".item-action");if(!item.available){const b=document.createElement("button");b.type="button";b.className="add-btn";b.disabled=true;b.textContent="غير متوفر";a.appendChild(b)}else if(q>0)a.appendChild(buildQtyControls(key,q));else{const b=document.createElement("button");b.type="button";b.className="add-btn";b.textContent="إضافة";b.addEventListener("click",()=>{state.cart.set(key,1);renderMenu();updateCartBar()});a.appendChild(b)}items.appendChild(card)});s.appendChild(items);menuElement.appendChild(s)});emptyResults.style.display=visible?"none":"block"}
function cartItems(){return [...state.cart.entries()].map(([key,quantity])=>{const item=findItem(key);return item?{...item,quantity}:null}).filter(Boolean)}
function cartCountValue(){return cartItems().reduce((s,x)=>s+x.quantity,0)}function cartTotalValue(){return cartItems().reduce((s,x)=>s+x.quantity*x.price,0)}
function updateCartBar(){const c=cartCountValue();$("cartCount").textContent=`${c.toLocaleString("ar-IQ")} ${c===1?"صنف":"أصناف"}`;$("cartTotal").textContent=`المجموع: ${formatPrice(cartTotalValue())}`;cartBar.classList.toggle("visible",c>0)}
function validateDelivery(show){const fields=[[$("customerName"),$("nameError"),"يرجى إدخال الاسم."],[$("customerAddress"),$("addressError"),"يرجى إدخال العنوان."],[$("customerPhone"),$("phoneError"),"يرجى إدخال رقم الهاتف."]];let ok=true;fields.forEach(([i,e,m])=>{const bad=!i.value.trim();i.classList.toggle("invalid",bad);e.textContent=show&&bad?m:"";if(bad)ok=false});return ok}
function updateSendButtonState(){let ok=cartCountValue()>0;if(state.mode==="delivery")ok=ok&&validateDelivery(false);sendOrderBtn.disabled=!ok}
function renderCartDialog(){const items=cartItems();cartLines.innerHTML="";if(!items.length)cartLines.innerHTML='<div style="padding:15px 0;color:#6b7280;text-align:center">السلة فارغة.</div>';items.forEach(item=>{const line=document.createElement("div");line.className="cart-line";const left=document.createElement("div");left.innerHTML=`<div class="cart-line-name">${esc(item.name)}</div><div class="cart-line-controls"></div>`;const price=document.createElement("div");price.className="cart-line-price";price.textContent=formatPrice(item.quantity*item.price);const controls=left.querySelector(".cart-line-controls");controls.appendChild(buildQtyControls(item.key,item.quantity));const rm=document.createElement("button");rm.type="button";rm.className="remove-btn";rm.textContent="حذف";rm.addEventListener("click",()=>{state.cart.delete(item.key);renderMenu();updateCartBar();renderCartDialog();if(!cartCountValue()&&cartDialog.open)cartDialog.close()});controls.appendChild(rm);line.append(left,price);cartLines.appendChild(line)});$("dialogTotal").textContent=formatPrice(cartTotalValue());deliveryFields.hidden=state.mode!=="delivery";sendOrderBtn.style.display=state.mode==="browse"?"none":"block";browseMessage.style.display=state.mode==="browse"?"block":"none";browseMessage.textContent=state.mode==="browse"?"هذه الصفحة في وضع التصفّح فقط لأنها فُتحت دون رقم طاولة أو رابط توصيل.":"";updateSendButtonState()}
function openCart(){if(!cartCountValue())return;renderCartDialog();cartDialog.showModal()}
function buildWhatsAppMessage(){const lines=[state.mode==="table"?`طلب طاولة رقم ${state.tableNumber}`:"طلب توصيل",`من ${SHOP}`,"","الأصناف:"];cartItems().forEach(i=>lines.push(`${i.name} × ${i.quantity} — ${formatPrice(i.quantity*i.price)}`));lines.push("",`المجموع الكلي: ${formatPrice(cartTotalValue())}`);if(state.mode==="delivery")lines.push("",`الاسم: ${$("customerName").value.trim()}`,`العنوان: ${$("customerAddress").value.trim()}`,`الهاتف: ${$("customerPhone").value.trim()}`);return lines.join("\n")}
function sendOrder(){if(!cartCountValue())return;if(state.mode==="delivery"&&!validateDelivery(true))return;location.href=`https://wa.me/${PHONE}?text=${encodeURIComponent(buildWhatsAppMessage())}`}
function updateModeUI(){ $("shopTitle").textContent=SHOP;modeBar.textContent=state.mode==="table"?`الوضع الحالي: طاولة رقم ${state.tableNumber}`:state.mode==="delivery"?"الوضع الحالي: توصيل":"الوضع الحالي: تصفّح فقط"}
searchInput.addEventListener("input",()=>{state.search=searchInput.value;renderMenu()});cartBar.addEventListener("click",openCart);$("closeDialog").addEventListener("click",()=>cartDialog.close());sendOrderBtn.addEventListener("click",sendOrder);["customerName","customerAddress","customerPhone"].forEach(id=>$(id).addEventListener("input",()=>{validateDelivery(false);updateSendButtonState()}));readOrderMode();renderCategoryNav();updateModeUI();renderMenu();updateCartBar();renderCartDialog();
</script>
</body></html>
